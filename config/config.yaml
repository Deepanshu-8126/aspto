# ────────────────────────────────────────────────
# AIInfluencerOS — Master Configuration
# ────────────────────────────────────────────────

# ── Gemini API (free tier) ──
gemini:
  api_key: "CHANGE_ME"            # Get from https://aistudio.google.com/app/apikey
  model: "gemini-2.0-flash"
  temperature: 0.8
  max_tokens: 1024

# ── Instagram (instagrapi) ──
instagram:
  username: "diyarai_016"
  password: "CHANGE_ME"
  session_id: ""                  # optional browser sessionid cookie (loaded from .env)
  mode: "on_demand"               # "on_demand" (jab tera mood ho) ya "automatic"
  max_posts_per_day: 5
  human_delay_min: 60             # seconds between actions
  human_delay_max: 300

# ── Telegram Bot ──
telegram:
  bot_token: "CHANGE_ME"          # Loaded from .env (TELEGRAM_BOT_TOKEN)
  admin_chat_id: "CHANGE_ME"      # Loaded from .env (TELEGRAM_ADMIN_CHAT_ID)

# ── WhatsApp (OpenWA) ──
whatsapp:
  api_url: "http://localhost:8080" # OpenWA server URL
  session_id: "default"
  max_dms_per_day: 50
  reply_delay_min: 3              # seconds
  reply_delay_max: 10

# ── Cloud GPU (Colab/Kaggle Gradio API) ──
cloud:
  gradio_url: "CHANGE_ME"         # ngrok/Colab URL e.g. https://xxxx.ngrok-free.app
  timeout: 900                    # 15 min per generation
  retry_attempts: 3
  retry_delay: 30                 # seconds

# ── Google Drive (output storage) ──
gdrive:
  output_folder: "/content/drive/MyDrive/ai_influencer/output"

# ── Paths ──
paths:
  database: "data/influencer.db"
  output_dir: "output"
  models_dir: "models"
  lora_path: "models/lora/my_face.safetensors"
  voice_ref: "models/voice/reference.wav"

# ── Video Settings ──
video:
  width: 1080
  height: 1920
  fps: 30
  codec: "libx264"
  format: "mp4"
  duration: 30                    # target reel duration in seconds
  aspect_ratio: "9:16"

# ── Scheduler ──
scheduler:
  timezone: "Asia/Kolkata"
  post_times:                     # Daily auto-post times (24hr)
    - "09:00"
    - "13:00"
    - "17:00"
    - "20:00"
    - "22:00"
  topics_rotation:                # Auto-topic rotation
    - "skincare routine"
    - "morning motivation"
    - "fitness tips"
    - "fashion haul"
    - "productivity hacks"
    - "self-care Sunday"
    - "healthy recipes"
    - "study with me"
    - "get ready with me"
    - "room makeover"

# ── Generation Pipeline ──
pipeline:
  image_engine: "z_image"         # "z_image" (3s, 6GB VRAM, #1 Arena, Apache 2.0), "fooocus", "comfyui"
  z_image_url: "http://127.0.0.1:8889"
  z_image_model: "Tongyi-MAI/Z-Image-Turbo"
  qwen_image_edit_url: "http://127.0.0.1:8890"
  fooocus_url: "http://127.0.0.1:8888"
  fooocus_base_model: "juggernautXL_v8Rundiffusion.safetensors"
  fooocus_styles:
    - "Fooocus V2"
    - "Fooocus Masterpiece"
    - "Fooocus Enhance"
  fooocus_aspect_ratio: "704*1408" # 9:16 vertical video ratio for reels
  fooocus_performance: "Quality"   # "Speed", "Quality", "Extreme Speed"
  comfyui_url: "http://127.0.0.1:8188"
  sd_model: "v1-5-pruned.safetensors"
  lora_strength: 0.90
  wan_model: "Wan-AI/Wan2.2-FLF2V-14B"  # First/Last Frame exact trajectory (Apache 2.0, 16GB)
  hunyuan_model: "Tencent/HunyuanVideo-1.5" # 75s continuous full reel (Apache 2.0, 16GB)
  voice_model: "QwenLM/Qwen3-TTS"  # 3s clone, 97ms, Apache 2.0
  video_clip_duration: 30         # seconds per reel
  num_clips: 1                    # Single-shot 1 continuous pass



# ── Rate Limits ──
rate_limits:
  instagram_posts_per_day: 5
  instagram_stories_per_day: 10
  instagram_comments_per_hour: 20
  whatsapp_dms_per_day: 50
  generation_per_day: 10

# ── Trend & Viral Engine (OpenShorts + Viralis) ──
trends:
  engine: "viralis"               # "viralis", "openshorts", or "hybrid"
  viral_threshold: 0.70
  sources:
    - "youtube_shorts"
    - "instagram_reels"
    - "google_trends"
  mcp_server_enabled: true
  auto_slice_duration: 30         # seconds

# ── Face Engine (Triple Face Lock) ──
face_engine:
  primary: "facefusion"           # "facefusion" (26K ⭐), "reactor", or "lora"
  triple_lock_enabled: true       # LoRA + FaceFusion + ReActor
  facefusion:
    swapper_model: "inswapper_128_fp16"
    enhancer_model: "gfpgan_1.4"
    execution_providers: ["cuda", "cpu"]
  reactor:
    restore_face: "CodeFormer"
    face_restore_visibility: 1.0

# ── Video Engine (Wan2.2 FLF2V + Hunyuan-1.5 + SkyReels-V2 + HappyHorse-1.0) ──
video_engine:
  default_engine: "wan2.2_flf2v"  # "wan2.2_flf2v" (open weights Wan-AI/Wan2.2-FLF2V-14B on HF), "hunyuan_1.5" (75s continuous), "skyreels_v2" (33 expressions)
  sequential_execution: true      # runs 1 model at a time on Kaggle T4 to stay within 16GB VRAM
  wan2_2_flf2v:
    model: "Wan-AI/Wan2.2-FLF2V-14B"
    license: "Apache 2.0"
    vram_profile: "14-16GB (Kaggle T4 / Colab GPU)"
    first_frame_control: true     # Influencer Face
    last_frame_control: true      # Target Pose
  hunyuan_1_5:
    model: "Tencent/HunyuanVideo-1.5"
    license: "Apache 2.0"
    continuous_duration: 75       # full 75-second reel in 1 shot
    params: "8.3B"
    vram_profile: "14-16GB"
  skyreels_v2:
    model: "Skywork/SkyReels-V2"
    expressions: 33
    motions: 400
    vram_profile: "14GB"
    default_expression: "confident_smile"
  happyhorse_1_0:
    model: "HappyHorse/HappyHorse-1.0"
    resolution: "2160x3840"       # 4K Ultra HD cinematic
    crf: 17
  wan2_2:
    model: "Wan-AI/Wan2.2-T2V-A14B"
    license: "Apache 2.0"
    fps: 30
    duration: 5
  ltx_2_5:
    model: "Lightricks/LTX-2.5"
    params: "22B"

    single_pass_audio: true
  duix_avatar:
    offline_mode: true
    renderer: "Duix-Digital-Human"

# ── Voice Engine (GPT-SoVITS + Qwen3-TTS) ──
voice_engine:
  primary: "qwen3_tts"            # "qwen3_tts" (3 sec, Apache 2.0) or "gpt_sovits" (1 min)
  qwen3_tts:
    sample_rate: 48000
    languages: ["en", "hi", "es", "ja"]
  gpt_sovits:
    ref_audio: "models/voice/reference.wav"
    few_shot: true

# ── AI Director & Programmatic Studio (openblur + HyperFrames + DaanKieft Studio) ──
openblur_agent:
  enabled: true
  director: "AI Squid Agent"
  auto_storyboard: true
  default_pacing: "audio_reactive"

hyperframes:
  enabled: true
  theme: "luxury_gold"            # "luxury_gold", "neon_cyberpunk", "clean_minimal"
  karaoke_captions: true

studio_web_app:
  adapter: "DaanKieft/ai-influencer"
  local_first: true
  storage: "data/studio_profile.json"

# ── Publish Engine (Agentfy + Automie + Auto-Reels) ──
publish_engine:
  orchestrator: "agentfy"         # "agentfy" (1 agent -> 5 platforms)
  anti_ban_shield: "automie"      # "automie" (Playwright + Gemini human-like mimicry)
  auto_reels_one_click: true      # ilias20055/Auto-Reels-Generator
  platforms:
    instagram: true
    youtube_shorts: true
    tiktok: true
    x_twitter: true
    whatsapp: true

