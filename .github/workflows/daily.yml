name: AI Influencer Daily Automation (Zero Laptop Load)

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST
    - cron: '30 4 * * *'
    # 12:30 UTC = 06:00 PM IST
    - cron: '30 12 * * *'

  workflow_dispatch:
    inputs:
      manual_reel_url:
        description: 'Custom Instagram Reel URL to copy (Optional)'
        required: false
        default: ''
      manual_dress:
        description: 'Outfit Description (Optional)'
        required: false
        default: 'chic red evening gown'
      manual_bg:
        description: 'Background Scene (Optional)'
        required: false
        default: 'luxury penthouse balcony'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Lightweight Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gradio-client instagrapi requests pyyaml

      - name: 🚀 Execute AI Influencer Pipeline (Hugging Face ZeroGPU)
        env:
          HF_VIDEO_SPACE: ${{ secrets.HF_VIDEO_SPACE }}
          HF_UPSCALER_SPACE: ${{ secrets.HF_UPSCALER_SPACE }}
          HF_TOKENS: ${{ secrets.HF_TOKENS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          MANUAL_REEL_URL: ${{ github.event.inputs.manual_reel_url }}
          MANUAL_DRESS: ${{ github.event.inputs.manual_dress }}
          MANUAL_BG: ${{ github.event.inputs.manual_bg }}
        run: |
          python actions/main.py

      - name: 💾 Save Generated Reel as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-reels
          path: /tmp/*.mp4
          retention-days: 7
